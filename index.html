<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Toilet Catcher</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1b2a;
            position: fixed;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <audio id="voiceCatch" src="catch.mp3" preload="auto"></audio>
    <audio id="voiceMiss" src="miss.mp3" preload="auto"></audio>
    <audio id="voiceGameOver" src="gameover.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const voiceCatch = document.getElementById("voiceCatch");
        const voiceMiss = document.getElementById("voiceMiss");
        const voiceGameOver = document.getElementById("voiceGameOver");
        const bgMusic = document.getElementById("bgMusic");

        let musicStarted = false;
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let candies = [];
        let spawnTimer = 0;

        const candyIcons = ["💩", "💩", "💩", "💩"];

        const basket = {
            width: 80,
            height: 60,
            x: 0,
            y: 0,
            icon: "🚽"
        };

        // Get safe-area top padding for Dynamic Island / punch hole
        function getSafeAreaTop() {
            const div = document.createElement("div");
            div.style.paddingTop = "env(safe-area-inset-top, 0px)";
            document.body.appendChild(div);
            const topInset = parseInt(window.getComputedStyle(div).paddingTop, 10) || 0;
            document.body.removeChild(div);
            return Math.max(topInset, 30); // minimum 30px buffer
        }

        let safeTop = 40;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            safeTop = getSafeAreaTop();

            // Scale basket proportionally based on screen width
            basket.width = Math.min(canvas.width * 0.22, 90);
            basket.height = basket.width * 0.75;

            // Safe bottom margin for gesture bar
            basket.y = canvas.height - basket.height - 40;
            basket.x = Math.max(0, Math.min(canvas.width - basket.width, basket.x));
        }

        window.addEventListener("resize", resizeCanvas);
        window.addEventListener("orientationchange", resizeCanvas);
        resizeCanvas();
        basket.x = canvas.width / 2 - basket.width / 2;

        function playAudio(audioElement) {
            if (!audioElement) return;
            audioElement.currentTime = 0;
            audioElement.play().catch(() => { });
        }

        function startBackgroundMusic() {
            if (gameOver) return;
            if (!musicStarted && bgMusic.src) {
                bgMusic.volume = 0.3;
                bgMusic.play().then(() => {
                    musicStarted = true;
                }).catch(() => { });
            }
        }

        function stopBackgroundMusic() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            musicStarted = false;
        }

        function handlePointer(clientX) {
            startBackgroundMusic();
            basket.x = Math.max(0, Math.min(canvas.width - basket.width, clientX - basket.width / 2));
        }

        canvas.addEventListener("pointermove", (e) => {
            handlePointer(e.clientX);
        });

        canvas.addEventListener("pointerdown", (e) => {
            if (gameOver) {
                score = 0;
                lives = 3;
                candies = [];
                gameOver = false;
                startBackgroundMusic();
                requestAnimationFrame(update);
            } else {
                handlePointer(e.clientX);
            }
        });

        function spawnCandy() {
            const icon = candyIcons[Math.floor(Math.random() * candyIcons.length)];
            const size = Math.min(canvas.width * 0.09, 36);
            candies.push({
                x: Math.random() * (canvas.width - size * 2) + size,
                y: -size,
                speed: (canvas.height * 0.005) + Math.random() * 2,
                icon: icon,
                size: size
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameOver) {
                spawnTimer++;
                if (spawnTimer % 38 === 0) {
                    spawnCandy();
                }

                // Render Toilet Basket
                ctx.font = `${basket.width * 0.72}px sans-serif`;
                ctx.textAlign = "center";
                ctx.fillText(basket.icon, basket.x + basket.width / 2, basket.y + basket.height * 0.85);

                for (let i = candies.length - 1; i >= 0; i--) {
                    const candy = candies[i];
                    candy.y += candy.speed;

                    ctx.font = `${candy.size}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(candy.icon, candy.x, candy.y);

                    // Catch detection
                    if (
                        candy.y >= basket.y &&
                        candy.y <= basket.y + basket.height &&
                        candy.x >= basket.x - 10 &&
                        candy.x <= basket.x + basket.width + 10
                    ) {
                        score += 10;
                        playAudio(voiceCatch);
                        candies.splice(i, 1);
                        continue;
                    }

                    // Miss detection
                    if (candy.y > canvas.height + candy.size) {
                        candies.splice(i, 1);
                        lives--;
                        playAudio(voiceMiss);

                        if (lives <= 0) {
                            gameOver = true;
                            stopBackgroundMusic();
                            playAudio(voiceGameOver);
                        }
                    }
                }

                // HUD positioned below Dynamic Island / front cameras
                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 20px sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(`Score: ${score}`, 24, safeTop + 20);
                ctx.textAlign = "right";
                ctx.fillText(`${"❤️".repeat(lives)}`, canvas.width - 24, safeTop + 20);

                requestAnimationFrame(update);
            } else {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 40);

                ctx.font = "22px sans-serif";
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

                ctx.font = "16px sans-serif";
                ctx.fillStyle = "#38bdf8";
                ctx.fillText("Tap anywhere to play again", canvas.width / 2, canvas.height / 2 + 60);
            }
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
