<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Toilet Catcher</title>
    <style>
        body {
            margin: 0;
            background: #0d1b2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: #fff;
        }

        h1 {
            margin: 6px 0;
            font-size: 24px;
        }

        #gameCanvas {
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            border: 3px solid #38bdf8;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            cursor: none;
        }

        p {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>🚽 Toilet Catcher</h1>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <p>Move your mouse or slide your finger to catch the items!</p>

    <audio id="voiceCatch" src="catch.mp3" preload="auto"></audio>
    <audio id="voiceMiss" src="miss.mp3" preload="auto"></audio>
    <audio id="voiceGameOver" src="gameover.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="music.mp3" preload="auto" loop=""></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const voiceCatch = document.getElementById("voiceCatch");
        const voiceMiss = document.getElementById("voiceMiss");
        const voiceGameOver = document.getElementById("voiceGameOver");
        const bgMusic = document.getElementById("bgMusic");

        let musicStarted = false;

        function playAudio(audioElement) {
            if (!audioElement) return;
            audioElement.currentTime = 0;
            audioElement.play().catch(() => { });
        }

        function startBackgroundMusic() {
            if (gameOver) return;
            if (!musicStarted && bgMusic.src) {
                bgMusic.volume = 0.3;
                bgMusic.play().then(() => {
                    musicStarted = true;
                }).catch(() => { });
            }
        }

        function stopBackgroundMusic() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            musicStarted = false;
        }

        let score = 0;
        let lives = 3;
        let gameOver = false;
        const candyIcons = ["💩", "💩", "💩", "💩"];

        const basket = {
            width: 70,
            height: 50,
            x: canvas.width / 2 - 35,
            y: canvas.height - 60,
            icon: "🚽"
        };

        let candies = [];
        let spawnTimer = 0;

        canvas.addEventListener("mousemove", (e) => {
            startBackgroundMusic();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            basket.x = Math.max(0, Math.min(canvas.width - basket.width, mouseX - basket.width / 2));
        });

        canvas.addEventListener("touchmove", (e) => {
            startBackgroundMusic();
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            basket.x = Math.max(0, Math.min(canvas.width - basket.width, touchX - basket.width / 2));
        }, { passive: false });

        canvas.addEventListener("click", () => {
            if (gameOver) {
                score = 0;
                lives = 3;
                candies = [];
                gameOver = false;
                startBackgroundMusic();
                requestAnimationFrame(update);
            } else {
                startBackgroundMusic();
            }
        });

        function spawnCandy() {
            const icon = candyIcons[Math.floor(Math.random() * candyIcons.length)];
            candies.push({
                x: Math.random() * (canvas.width - 30) + 15,
                y: -20,
                speed: 2.5 + Math.random() * 2,
                icon: icon,
                size: 28
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameOver) {
                spawnTimer++;
                if (spawnTimer % 45 === 0) {
                    spawnCandy();
                }

                ctx.font = "48px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(basket.icon, basket.x + basket.width / 2, basket.y + 42);

                for (let i = candies.length - 1; i >= 0; i--) {
                    const candy = candies[i];
                    candy.y += candy.speed;

                    ctx.font = `${candy.size}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(candy.icon, candy.x, candy.y);

                    // Catch candy in the toilet bowl
                    if (
                        candy.y >= basket.y &&
                        candy.y <= basket.y + basket.height &&
                        candy.x >= basket.x - 5 &&
                        candy.x <= basket.x + basket.width + 5
                    ) {
                        score += 10;
                        playAudio(voiceCatch);
                        candies.splice(i, 1);
                        continue;
                    }

                    // Miss candy
                    if (candy.y > canvas.height + 20) {
                        candies.splice(i, 1);
                        lives--;
                        playAudio(voiceMiss);

                        if (lives <= 0) {
                            gameOver = true;
                            stopBackgroundMusic();
                            playAudio(voiceGameOver);
                        }
                    }
                }

                ctx.fillStyle = "#1e293b";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(`Score: ${score}`, 15, 30);
                ctx.textAlign = "right";
                ctx.fillText(`Lives: ${"❤️".repeat(lives)}`, canvas.width - 15, 30);

                requestAnimationFrame(update);
            } else {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.font = "18px sans-serif";
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);

                ctx.font = "14px sans-serif";
                ctx.fillStyle = "#7dd3fc";
                ctx.fillText("Click anywhere to play again", canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
