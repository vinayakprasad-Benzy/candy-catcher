<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Toilet Catcher</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #0d1b2a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
        }

        #gameCanvas {
            aspect-ratio: 9 / 16;
            width: 100vw;
            max-height: 100vh;
            max-width: calc(100vh * 9 / 16);
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            cursor: none;
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <audio id="voiceCatch" src="catch.mp3" preload="auto"></audio>
    <audio id="voiceMiss" src="miss.mp3" preload="auto"></audio>
    <audio id="voiceGameOver" src="gameover.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const voiceCatch = document.getElementById("voiceCatch");
        const voiceMiss = document.getElementById("voiceMiss");
        const voiceGameOver = document.getElementById("voiceGameOver");
        const bgMusic = document.getElementById("bgMusic");

        let musicStarted = false;

        function playAudio(audioElement) {
            if (!audioElement) return;
            audioElement.currentTime = 0;
            audioElement.play().catch(() => { });
        }

        function startBackgroundMusic() {
            if (gameOver) return;
            if (!musicStarted && bgMusic.src) {
                bgMusic.volume = 0.3;
                bgMusic.play().then(() => {
                    musicStarted = true;
                }).catch(() => { });
            }
        }

        function stopBackgroundMusic() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
            musicStarted = false;
        }

        let score = 0;
        let lives = 3;
        let gameOver = false;
        const candyIcons = ["💩", "💩", "💩", "💩"];

        const basket = {
            width: 72,
            height: 52,
            x: canvas.width / 2 - 36,
            y: canvas.height - 75,
            icon: "🚽"
        };

        let candies = [];
        let spawnTimer = 0;

        function handlePointer(clientX) {
            startBackgroundMusic();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const canvasX = (clientX - rect.left) * scaleX;
            basket.x = Math.max(0, Math.min(canvas.width - basket.width, canvasX - basket.width / 2));
        }

        canvas.addEventListener("mousemove", (e) => {
            handlePointer(e.clientX);
        });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                handlePointer(e.touches[0].clientX);
            }
        }, { passive: false });

        canvas.addEventListener("pointerdown", () => {
            if (gameOver) {
                score = 0;
                lives = 3;
                candies = [];
                gameOver = false;
                startBackgroundMusic();
                requestAnimationFrame(update);
            } else {
                startBackgroundMusic();
            }
        });

        function spawnCandy() {
            const icon = candyIcons[Math.floor(Math.random() * candyIcons.length)];
            candies.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                speed: 3 + Math.random() * 2.5,
                icon: icon,
                size: 32
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameOver) {
                spawnTimer++;
                if (spawnTimer % 40 === 0) {
                    spawnCandy();
                }

                ctx.font = "52px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(basket.icon, basket.x + basket.width / 2, basket.y + 44);

                for (let i = candies.length - 1; i >= 0; i--) {
                    const candy = candies[i];
                    candy.y += candy.speed;

                    ctx.font = `${candy.size}px sans-serif`;
                    ctx.textAlign = "center";
                    ctx.fillText(candy.icon, candy.x, candy.y);

                    // Collision detection
                    if (
                        candy.y >= basket.y &&
                        candy.y <= basket.y + basket.height &&
                        candy.x >= basket.x - 8 &&
                        candy.x <= basket.x + basket.width + 8
                    ) {
                        score += 10;
                        playAudio(voiceCatch);
                        candies.splice(i, 1);
                        continue;
                    }

                    // Miss detection
                    if (candy.y > canvas.height + 25) {
                        candies.splice(i, 1);
                        lives--;
                        playAudio(voiceMiss);

                        if (lives <= 0) {
                            gameOver = true;
                            stopBackgroundMusic();
                            playAudio(voiceGameOver);
                        }
                    }
                }

                // UI Heads Up Display
                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 18px sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(`Score: ${score}`, 18, 38);
                ctx.textAlign = "right";
                ctx.fillText(`${"❤️".repeat(lives)}`, canvas.width - 18, 38);

                requestAnimationFrame(update);
            } else {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 30);

                ctx.font = "20px sans-serif";
                ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);

                ctx.font = "15px sans-serif";
                ctx.fillStyle = "#38bdf8";
                ctx.fillText("Tap anywhere to restart", canvas.width / 2, canvas.height / 2 + 65);
            }
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
